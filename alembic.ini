# Alembic configuration for database migrations.
#
# The team's technology-selection document mandates Alembic so that every schema
# change goes through a migration and the database can be rebuilt reproducibly.
#
# The database URL is NOT stored here -- that would mean committing credentials.
# env.py reads it from application settings (environment variables) at runtime.
#
# !! THIS FILE MUST STAY PURE ASCII !!
# Alembic reads it with configparser using encoding="locale", so the decoder
# depends on the machine's active code page. On a Chinese Windows box that is
# cp936/GBK, and a single em dash or CJK character here makes EVERY alembic
# command die with:
#     UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 ...
# before it even reaches the database. Use ASCII in comments; put any non-ASCII
# prose in README.md or docs/ instead (those are read as UTF-8).
#
# Common commands:
#   alembic revision --autogenerate -m "add reservations table"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history --verbose
#   alembic current

[alembic]
script_location = src/data/migration

# Template for new migration files. The leading %(year)d... timestamp keeps
# files ordered chronologically in a directory listing, which matters when ten
# people generate migrations in the same week.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamp above. Without this Alembic uses local time and
# two developers in different timezones produce inconsistently ordered files.
timezone = UTC

# Truncate long autogenerate messages so filenames stay sane.
truncate_slug_length = 40

# How multi-head version paths are separated. `path_separator` is the current
# key name; `version_path_separator` is its deprecated predecessor. Both are
# kept because requirements.txt allows alembic>=1.13, and `path_separator` only
# exists from 1.15 onward -- keeping both makes the config correct across that
# whole range. Modern Alembic finds `path_separator` first and never reads the
# deprecated key, so no DeprecationWarning is raised (this repo turns warnings
# into errors via pyproject.toml `filterwarnings`). Drop the legacy line once
# the minimum pin is raised to >=1.15.
#
# ASCII ONLY in this file -- see the warning at the top of the file.
path_separator = os
version_path_separator = os

prepend_sys_path = .

# ---------------------------------------------------------------------------
# Logging for Alembic itself.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
